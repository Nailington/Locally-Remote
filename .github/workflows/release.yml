name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build Universal Release, PKG & Homebrew Formula
    runs-on: macos-15

    steps:
      - name: Determine release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: Stamp CLI version from tag
        run: |
          cat <<EOF > Sources/LocallyRemoteCore/Version.swift
          public enum LocallyRemoteVersion {
              public static let current = "${{ steps.meta.outputs.version }}"
          }
          EOF

      - name: Run tests
        run: swift test

      - name: Build universal macOS binary (arm64 + x86_64)
        run: |
          swift build -c release --arch arm64 --arch x86_64
          BIN=".build/apple/Products/Release/locally-remote"
          lipo -info "$BIN"
          lipo "$BIN" -verify_arch arm64 x86_64
          ACTUAL_VER="$("$BIN" --version)"
          test "$ACTUAL_VER" = "${{ steps.meta.outputs.version }}"

      - name: Package tarball and macOS .pkg installer
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          BIN=".build/apple/Products/Release/locally-remote"
          mkdir -p dist

          # 1. Generate shell completions from the built binary
          COMP_STAGE="dist/completions"
          mkdir -p "${COMP_STAGE}"
          "${BIN}" completions zsh > "${COMP_STAGE}/_locally-remote"
          "${BIN}" completions bash > "${COMP_STAGE}/locally-remote.bash"
          "${BIN}" completions fish > "${COMP_STAGE}/locally-remote.fish"

          # 2. Universal tarball (used by Homebrew, curl installer, and manual installs)
          TAR_STAGE="dist/locally-remote-${VERSION}-macos-universal"
          mkdir -p "${TAR_STAGE}"
          cp "${BIN}" "${TAR_STAGE}/locally-remote"
          chmod 0755 "${TAR_STAGE}/locally-remote"
          cp README.md LICENSE "${TAR_STAGE}/"
          cp -R docs skills "${COMP_STAGE}" "${TAR_STAGE}/"

          TAR_NAME="locally-remote-${VERSION}-macos-universal.tar.gz"
          tar -C dist -czf "dist/${TAR_NAME}" "locally-remote-${VERSION}-macos-universal"

          # 3. Native macOS .pkg installer (installs binary + zsh completion)
          PKG_ROOT="dist/pkgroot"
          mkdir -p "${PKG_ROOT}/usr/local/bin" "${PKG_ROOT}/usr/local/share/zsh/site-functions"
          cp "${BIN}" "${PKG_ROOT}/usr/local/bin/locally-remote"
          chmod 0755 "${PKG_ROOT}/usr/local/bin/locally-remote"
          cp "${COMP_STAGE}/_locally-remote" "${PKG_ROOT}/usr/local/share/zsh/site-functions/_locally-remote"
          chmod 0644 "${PKG_ROOT}/usr/local/share/zsh/site-functions/_locally-remote"

          COMP_PKG="dist/locally-remote-component.pkg"
          PKG_NAME="locally-remote-${VERSION}-macos-universal.pkg"

          pkgbuild \
            --root "${PKG_ROOT}" \
            --identifier "dev.hammerpot.locally-remote.pkg" \
            --version "${VERSION}" \
            --install-location "/" \
            "${COMP_PKG}"

          cat <<EOF > dist/distribution.xml
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="2">
              <title>Locally Remote ${VERSION}</title>
              <options customize="never" require-scripts="false" hostArchitectures="arm64,x86_64"/>
              <domains enable_localSystem="true"/>
              <choices-outline>
                  <line choice="default">
                      <line choice="dev.hammerpot.locally-remote.pkg"/>
                  </line>
              </choices-outline>
              <choice id="default"/>
              <choice id="dev.hammerpot.locally-remote.pkg" visible="false">
                  <pkg-ref id="dev.hammerpot.locally-remote.pkg"/>
              </choice>
              <pkg-ref id="dev.hammerpot.locally-remote.pkg" version="${VERSION}" onConclusion="none">locally-remote-component.pkg</pkg-ref>
          </installer-gui-script>
          EOF

          productbuild \
            --distribution dist/distribution.xml \
            --package-path dist \
            "dist/${PKG_NAME}"

          # 3. Checksums
          (
            cd dist
            shasum -a 256 "${TAR_NAME}" "${PKG_NAME}" > SHA256SUMS.txt
          )
          cat dist/SHA256SUMS.txt

          TAR_SHA256="$(shasum -a 256 "dist/${TAR_NAME}" | awk '{print $1}')"
          echo "tar_name=${TAR_NAME}" >> "$GITHUB_OUTPUT"
          echo "pkg_name=${PKG_NAME}" >> "$GITHUB_OUTPUT"
          echo "tar_sha256=${TAR_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          TAR_NAME="${{ steps.package.outputs.tar_name }}"
          PKG_NAME="${{ steps.package.outputs.pkg_name }}"
          REPO="${{ github.repository }}"

          cat <<EOF > dist/release-notes.md
          ## Install

          ### Homebrew

          \`\`\`bash
          brew install nailington/tap/locally-remote
          \`\`\`

          ### macOS Installer (.pkg)

          Download \`${PKG_NAME}\` and double-click to install \`/usr/local/bin/locally-remote\`, or install headlessly:

          \`\`\`bash
          sudo installer -pkg ${PKG_NAME} -target /
          \`\`\`

          ### Quick Shell Install

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${REPO}/${TAG}/scripts/install.sh | sh
          \`\`\`

          ### Checksums

          \`\`\`
          $(cat dist/SHA256SUMS.txt)
          \`\`\`
          EOF

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              "dist/${TAR_NAME}" \
              "dist/${PKG_NAME}" \
              "dist/SHA256SUMS.txt" \
              --clobber
            gh release edit "${TAG}" --notes-file dist/release-notes.md
          else
            gh release create "${TAG}" \
              "dist/${TAR_NAME}" \
              "dist/${PKG_NAME}" \
              "dist/SHA256SUMS.txt" \
              --title "Locally Remote ${TAG}" \
              --notes-file dist/release-notes.md \
              --generate-notes
          fi

      - name: Update Homebrew Formula on main
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          TAR_NAME="${{ steps.package.outputs.tar_name }}"
          TAR_SHA256="${{ steps.package.outputs.tar_sha256 }}"
          REPO="${{ github.repository }}"

          git fetch origin main
          git checkout -B main origin/main

          mkdir -p Formula
          cat <<EOF > Formula/locally-remote.rb
          class LocallyRemote < Formula
            desc "Headless Tailscale bridge for Xcode, CoreDevice, and SweetPad wireless builds"
            homepage "https://github.com/${REPO}"
            url "https://github.com/${REPO}/releases/download/${TAG}/${TAR_NAME}"
            version "${VERSION}"
            sha256 "${TAR_SHA256}"
            license "MIT"

            depends_on :macos

            def install
              bin.install "locally-remote"
              zsh_completion.install "completions/_locally-remote"
              bash_completion.install "completions/locally-remote.bash" => "locally-remote"
              fish_completion.install "completions/locally-remote.fish"
              doc.install "README.md", "docs", "skills"
            end

            service do
              run [opt_bin/"locally-remote", "daemon", "--bind", "lo0"]
              keep_alive true
              log_path var/"log/locally-remote.log"
              error_log_path var/"log/locally-remote.log"
            end

            def caveats
              <<~EOS
                Capture your paired iPhone once while on shared local Wi-Fi:
                  locally-remote capture

                Start the background daemon either via LaunchAgent:
                  locally-remote install-agent
                or via Homebrew services:
                  brew services start locally-remote
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/locally-remote --version")
              assert_match "locally-remote", shell_output("#{bin}/locally-remote help")
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet Formula/locally-remote.rb; then
            git add Formula/locally-remote.rb
            git commit -m "Update Homebrew formula for ${TAG}"
            git push origin main
          fi
